<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Login | JBS Swift Forecast Portal</title>

    <link
            rel="stylesheet"
            href="/css/style.css"
    >

</head>

<body class="auth-page">

<main class="auth-container">

    <section class="auth-card">

        <div class="auth-brand">

            <h1>JBS Swift</h1>

            <p>Forecast Portal</p>

        </div>

        <div class="auth-heading">

            <h2>Welcome Back</h2>

            <p>
                Sign in to access the sales and margin forecasting dashboard.
            </p>

        </div>

        <form
                class="auth-form"
                id="login-form"
        >

            <div class="form-group">

                <label for="login-email">
                    Columbia Email
                </label>

                <input
                        type="email"
                        id="login-email"
                        name="email"
                        placeholder="abc1234@columbia.edu"
                        autocomplete="email"
                >

                <p
                        class="error-message"
                        id="login-email-error"
                ></p>

            </div>

            <div class="form-group">

                <label for="login-password">
                    Password
                </label>

                <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                >

                <p
                        class="error-message"
                        id="login-password-error"
                ></p>

            </div>

            <div class="auth-options">

                <label class="remember-option">

                    <input
                            type="checkbox"
                            name="remember"
                    >

                    <span>Remember me</span>

                </label>

                <a href="/forgot-password">
                    Forgot password?
                </a>

            </div>

            <button
                    type="submit"
                    class="auth-button"
            >
                Sign In
            </button>

        </form>

        <p class="auth-switch">

            Don’t have an account?

            <a href="/register">
                Create an account
            </a>

        </p>

    </section>

</main>

<script
        src="/js/script.js"
></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>
        Forgot Password | JBS Swift Forecast Portal
    </title>

    <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body class="auth-page">

<main class="auth-container">

    <section class="auth-card">

        <div class="auth-brand">

            <h1>JBS Swift</h1>

            <p>Forecast Portal</p>

        </div>

        <div class="auth-heading">

            <h2>Forgot Password</h2>

            <p>
                Enter your Columbia email address and
                we will send you a password reset code.
            </p>

        </div>

        <form
                class="auth-form"
                id="forgot-password-form"
        >

            <div class="form-group">

                <label for="forgot-password-email">
                    Columbia Email
                </label>

                <input
                        type="email"
                        id="forgot-password-email"
                        name="email"
                        placeholder="abc1234@columbia.edu"
                        autocomplete="email"
                >

                <p class="form-help">
                    Enter the email address connected
                    to your account.
                </p>

                <p
                        class="error-message"
                        id="forgot-password-email-error"
                        role="alert"
                ></p>

            </div>

            <button
                    type="submit"
                    class="auth-button"
            >
                Send Reset Code
            </button>

        </form>

        <p class="auth-switch">

            Remember your password?

            <a href="/login">
                Return to login
            </a>

        </p>

    </section>

</main>

<script
        src="{{ url_for('static', filename='js/script.js') }}"
></script>

</body>

</html>
